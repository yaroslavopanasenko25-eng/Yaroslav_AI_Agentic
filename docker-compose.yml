# Production stack for DigitalOcean Droplet (Docker Compose)
#
# Usage:
#   cp deploy/.env.production.example .env   # fill in secrets
#   docker compose up -d --build
#   open http://YOUR_DROPLET_IP

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    restart: unless-stopped
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: alarm-app/frontend/Dockerfile
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
