# DigitalOcean App Platform spec (alternative to Droplet + Docker Compose)
#
# Deploy:  doctl apps create --spec .do/app.yaml
# Or paste this file in: DO Console → Apps → Create → App Spec
#
# Note: For App Platform, the frontend nginx must reach the backend service.
# Set BACKEND_URL to your backend component's public URL after first deploy,
# then redeploy the web component.

name: guardianeye
region: fra

services:
  - name: backend
    dockerfile_path: backend/Dockerfile
    source_dir: /
    github:
      repo: YOUR_GITHUB_USER/YOUR_REPO
      branch: main
      deploy_on_push: true
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 30
    envs:
      - key: DEBUG
        value: "false"
      - key: SHELTERS_JSON_PATH
        value: /app/data/shelters.json
      - key: ALLOWED_ORIGINS
        value: ${APP_URL}
        type: GENERAL
      - key: SUPABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: SUPABASE_KEY
        scope: RUN_TIME
        type: SECRET
      - key: XAI_API_KEY
        scope: RUN_TIME
        type: SECRET
      - key: XAI_MODEL
        value: grok-3-mini
      - key: ALERTS_API_KEY
        scope: RUN_TIME
        type: SECRET

  - name: web
    dockerfile_path: alarm-app/frontend/Dockerfile
    source_dir: /
    github:
      repo: YOUR_GITHUB_USER/YOUR_REPO
      branch: main
      deploy_on_push: true
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    routes:
      - path: /
    depends_on:
      - backend
